[package]
name = "leggimi"
version = "2.0.0"
description = "Leggimi — Markdown viewer and editor for Windows"
authors = ["Enrico De Stefanis"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "leggimi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
notify-debouncer-full = "0.5"
walkdir = "2"
dunce = "1"
base64 = "0.22"
tokio = { version = "1", features = ["sync"] }

[target."cfg(windows)".dependencies]
# Graphics_Dwm, Graphics_Gdi, System_LibraryLoader, UI_HiDpi and
# UI_Input_KeyboardAndMouse: the native caption zones (caption.rs) and the
# window drags (drag.rs)
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_Packaging_Appx", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# the Windows build, which says whether there are Snap layouts (11) to serve;
# the version tao already uses
windows-version = "0.1"
# PDF export through ICoreWebView2_7::PrintToPdf; the versions must match the
# ones wry links, or the COM interface types do not unify
webview2-com = "0.38"
# System_UserProfile: the preferred languages list that picks the UI language;
# Services_Store and Win32_UI_Shell (IInitializeWithWindow): the Store's own
# rating dialog, owned by the window that asks for it
windows = { version = "0.61", features = ["System_UserProfile", "Foundation_Collections", "Services_Store", "Win32_Foundation", "Win32_UI_Shell"] }
# the completion handler of a WinRT async call (the rating dialog's); the
# version the windows crate above already uses
windows-future = { version = "0.2", default-features = false }
